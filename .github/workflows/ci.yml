name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Run Vitest coverage
        id: vitest
        continue-on-error: true
        run: bun run test:coverage

      - name: Run Electron E2E coverage
        id: e2e
        continue-on-error: true
        run: xvfb-run -a bun run e2e:coverage

      - name: Enforce coverage thresholds
        id: coverage_thresholds
        if: always()
        continue-on-error: true
        run: bun run coverage:check

      - name: Build coverage comment
        if: always()
        continue-on-error: true
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.conclusion }}
          VITEST_OUTCOME: ${{ steps.vitest.conclusion }}
          E2E_OUTCOME: ${{ steps.e2e.conclusion }}
          COVERAGE_OUTCOME: ${{ steps.coverage_thresholds.conclusion }}
        run: bun run coverage:comment

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-playwright-report
          path: |
            coverage
            playwright-report
          if-no-files-found: warn

      - name: Post PR coverage comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- lmbase-desktop-coverage -->';
            const body = fs.readFileSync('coverage/coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

      - name: Finalize required checks
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.conclusion }}
          VITEST_OUTCOME: ${{ steps.vitest.conclusion }}
          E2E_OUTCOME: ${{ steps.e2e.conclusion }}
          COVERAGE_OUTCOME: ${{ steps.coverage_thresholds.conclusion }}
        run: |
          failures=0

          for step in TYPECHECK_OUTCOME VITEST_OUTCOME E2E_OUTCOME COVERAGE_OUTCOME; do
            value="${!step}"
            if [ "$value" != "success" ]; then
              echo "$step failed with outcome: $value"
              failures=1
            fi
          done

          exit "$failures"
